name = "shinatal-turnstile"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secretos — NUNCA vão aqui; configure com:
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put FIREBASE_API_KEY   (a mesma apiKey de firebase-config.local.json)
# (ou pelo painel Cloudflare: Workers & Pages > shinatal-turnstile > Settings > Variables).
[vars]
FIREBASE_PROJECT_ID = "shinetal-cda20"
# Lista separada por vírgula das origens que podem chamar este Worker (só produção). Requisição de
# qualquer outra origem — ou sem Origin, como um script/curl — é recusada com 403 (ver src/index.js).
# Para testar localmente com "wrangler dev", NÃO acrescente localhost aqui: crie .dev.vars (já no
# .gitignore) com ALLOWED_ORIGINS="http://localhost:5500" e as chaves de teste do Turnstile.
ALLOWED_ORIGINS = "https://shinatal.shinerio.com,https://shinetal-cda20.web.app,https://shinetal-cda20.firebaseapp.com"
