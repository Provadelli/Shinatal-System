# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CSS do Tailwind é pré-compilado aqui (npm ci já dispara o postinstall que roda o build;
      # o passo explícito abaixo fica só pra deixar visível no log quando/como foi gerado).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHINETAL_CDA20 }}
          channelId: live
          projectId: shinetal-cda20
          # Versão fixa: a partir da 15.33 o firebase-tools exige serviceusage.services.get e o deploy dá 403.
          firebaseToolsVersion: 15.32.1
