<span class="font-medium text-on-surface">ti@</span>, <span class="font-medium text-on-surface">dp@</span>, ou <span class="font-medium text-on-surface">rh@</span><br/>

</p>

<div class="relative">

<input class="w-full bg-surface-lowest/50 border border-outline-variant rounded-lg py-2 pl-10 pr-3 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="nome@shinerio.com" type="email"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
